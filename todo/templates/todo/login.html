{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Login | To-Do App</title>

    <link rel="stylesheet" href="{% static 'todo/style.css' %}">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-icon">
                ✅
            </div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to manage your tasks
            </p>

            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>

            </form>

            <p class="auth-footer">

                Don't have an account?

                <a href="{% url 'register' %}">
                    Create Account
                </a>

            </p>

        </div>

    </div>

</body>

</html>
