{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Edit Task | To-Do App</title>

    <link rel="stylesheet" href="{% static 'todo/style.css' %}">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-icon">
                ✏️
            </div>

            <h1>Edit Task</h1>

            <p class="auth-subtitle">
                Update your task details
            </p>

            <form method="POST">

                {% csrf_token %}

                <label>
                    Task
                </label>

                <input
                    type="text"
                    name="title"
                    value="{{ task.title }}"
                    placeholder="Enter task"
                    required
                >

                <label>
                    Due Date
                </label>

                <input
                    type="date"
                    name="due_date"
                    value="{{ task.due_date|date:'Y-m-d' }}"
                >

                <label>
                    Priority
                </label>

                <select name="priority">

                    <option
                        value="Low"
                        {% if task.priority == "Low" %}
                            selected
                        {% endif %}
                    >
                        Low
                    </option>

                    <option
                        value="Medium"
                        {% if task.priority == "Medium" %}
                            selected
                        {% endif %}
                    >
                        Medium
                    </option>

                    <option
                        value="High"
                        {% if task.priority == "High" %}
                            selected
                        {% endif %}
                    >
                        High
                    </option>

                </select>

                <button
                    type="submit"
                    class="auth-button"
                >
                    Update Task
                </button>

            </form>

            <p class="auth-footer">

                <a href="{% url 'home' %}">
                    ← Back to Home
                </a>

            </p>

        </div>

    </div>

</body>

</html>
